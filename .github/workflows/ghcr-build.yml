name: Build and Push to GHCR

# Builds the Dash Docker image and pushes to GHCR.
# Quality gates (validate) must pass before the image is built.
# Promotion is a reviewed platform-infra digest update; this workflow never
# deploys a mutable tag directly.
#
# Published as ghcr.io/masonjames/dash.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: masonjames/dash

jobs:
  validate:
    name: Validate (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      postgres-search-path:
        image: agnohq/pgvector@sha256:e502d095cfb097bc6a4ac8b4bf12224d64c0a0d79fc2fe2b691a268ea2452681
        env:
          POSTGRES_USER: ai
          POSTGRES_DB: dash_search_path_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai -d dash_search_path_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the project with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy .

      - name: Prove PostgreSQL search-path boundaries
        env:
          DASH_TEST_POSTGRES_DSN: postgresql://ai@127.0.0.1:5432/dash_search_path_ci
        run: uv run pytest -q tests/test_postgres_search_path_integration.py

      - name: Test
        run: uv run pytest -q --ignore=tests/test_postgres_search_path_integration.py

  build:
    needs: [validate]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke-test private Ops app from the published image
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" -c \
            "from app.ops_main import app; from dash.ops_indexer import INDEXER_NAME; assert INDEXER_NAME == 'dash-canonical-hybrid-v1'; assert sorted(r.path for r in app.routes) == ['/internal/health/ready', '/internal/ops/evaluate-outcome', '/internal/ops/investigate']"

      - name: Output image info
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            printf "**Image:** %s\n" "$PUBLISHED_IMAGE"
            echo "**Tags:**"
            echo '```'
            printf '%s\n' "$PUBLISHED_TAGS"
            echo '```'
            printf "**Digest:** \`%s\`\n" "$PUBLISHED_DIGEST"
            echo "**Promotion:** update the single x-dash-image digest in platform-infra and release through review; no mutable-tag webhook deploy is performed."
          } >> "$GITHUB_STEP_SUMMARY"
