name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:
      - "main"

env:
  UV_SYSTEM_PYTHON: 1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres-search-path:
        image: agnohq/pgvector@sha256:e502d095cfb097bc6a4ac8b4bf12224d64c0a0d79fc2fe2b691a268ea2452681
        env:
          POSTGRES_USER: ai
          POSTGRES_DB: dash_search_path_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai -d dash_search_path_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Format with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy .

      - name: Prove PostgreSQL search-path boundaries
        env:
          DASH_TEST_POSTGRES_DSN: postgresql://ai@127.0.0.1:5432/dash_search_path_ci
        run: uv run pytest -q tests/test_postgres_search_path_integration.py

      - name: Test
        run: uv run pytest -q --ignore=tests/test_postgres_search_path_integration.py
